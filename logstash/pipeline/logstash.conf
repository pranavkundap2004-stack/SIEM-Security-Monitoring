input {
  file {
    path => "/usr/share/logstash/input/security_events.jsonl"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
  }
}

filter {
  mutate {
    add_field => {
      "pipeline" => "siem-security-monitoring"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "security-events-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}